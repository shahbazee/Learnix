<!-- Glassmorphic Footer for Learnix -->
<footer class="relative z-10 w-full mt-24 border-t border-slate-200/60 bg-white/60 backdrop-blur-xl">
  <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row items-center justify-between gap-6">
    
    <!-- Left: Brand -->
    <div class="flex items-center gap-2.5">
      {% include 'includes/_logo.html' with size="w-7 h-7" unique_id="footer" %}
      <span class="text-base font-extrabold tracking-tight text-[#0f172a]">{{ SITE_NAME }}</span>
      <span class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200/60">
        v1.0
      </span>
    </div>

    <!-- Center: Links -->
    <div class="flex flex-wrap items-center justify-center gap-6 text-xs text-slate-600 font-medium">
      <a href="{% url 'courses:course_list' %}" class="hover:text-slate-900 transition-colors">Courses</a>
      <a href="{% url 'courses:course_list' %}" class="hover:text-slate-900 transition-colors">Syllabus</a>
      <a href="{% url 'core:home' %}#membership" class="hover:text-slate-900 transition-colors">Membership</a>
      <a href="{% url 'core:home' %}#instructors" class="hover:text-slate-900 transition-colors">Faculty</a>
    </div>

    <!-- Right: Copyright -->
    <div class="text-[11px] text-slate-400 text-center md:text-right">
      &copy; 2026 {{ SITE_NAME }} Technologies Inc. All rights reserved.
    </div>
  </div>
</footer>
