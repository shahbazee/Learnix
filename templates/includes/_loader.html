{% load static %}
<!-- Learnix Modern Loading & Navigation Feedback System -->

<!-- 1. Sleek Top-Edge Progress Bar (NProgress-Style, Non-Blocking) -->
<div id="learnixProgressBar" class="learnix-progress-bar" aria-hidden="true"></div>

<!-- 2. Minimal Floating Status Pill (Thresholded for Slow Operations / Deep Syncs) -->
<div id="learnixGlobalLoader" class="learnix-loader-pill" aria-hidden="true" role="status" aria-live="polite">
  <div class="learnix-loader-pill-inner">
    <svg class="learnix-pill-spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
      <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <span id="learnixLoaderStatusText" class="learnix-pill-label">Processing...</span>
  </div>
</div>
