      <stop offset="0%" stop-color="#040914"/>
      <stop offset="50%" stop-color="#091426"/>
      <stop offset="100%" stop-color="#0E2338"/>
    </linearGradient>

    <linearGradient id="k8s-core" x1="0%" y1="0%" x2="100%" y2="100%">
