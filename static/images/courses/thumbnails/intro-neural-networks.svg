<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="nn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050713"/>
      <stop offset="50%" stop-color="#0C1026"/>
      <stop offset="100%" stop-color="#16153B"/>
    </linearGradient>

    <linearGradient id="nn-in" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="nn-hid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="nn-out" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <filter id="nn-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="nn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#nn-bg)"/>

  <circle cx="230" cy="380" r="180" fill="#0284C7" opacity="0.15" filter="url(#nn-glow)"/>
  <circle cx="600" cy="380" r="200" fill="#EC4899" opacity="0.15" filter="url(#nn-glow)"/>
  <circle cx="970" cy="380" r="180" fill="#8B5CF6" opacity="0.15" filter="url(#nn-glow)"/>

  <g stroke="#818CF8" stroke-width="8" opacity="0.45" stroke-linecap="round">
    <line x1="230" y1="270" x2="600" y2="190"/>
    <line x1="230" y1="270" x2="600" y2="380"/>
    <line x1="230" y1="270" x2="600" y2="570"/>
    <line x1="230" y1="490" x2="600" y2="190"/>
    <line x1="230" y1="490" x2="600" y2="380"/>
    <line x1="230" y1="490" x2="600" y2="570"/>

    <line x1="600" y1="190" x2="970" y2="270"/>
    <line x1="600" y1="190" x2="970" y2="490"/>
    <line x1="600" y1="380" x2="970" y2="270"/>
    <line x1="600" y1="380" x2="970" y2="490"/>
    <line x1="600" y1="570" x2="970" y2="270"/>
    <line x1="600" y1="570" x2="970" y2="490"/>
  </g>

  <g filter="url(#nn-shadow)">
    <g transform="translate(230, 270)">
      <circle cx="0" cy="0" r="68" fill="url(#nn-in)" stroke="#E0F2FE" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#E0F2FE" opacity="0.85"/>
      <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>
    </g>

    <g transform="translate(230, 490)">
      <circle cx="0" cy="0" r="68" fill="url(#nn-in)" stroke="#E0F2FE" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#E0F2FE" opacity="0.85"/>
      <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>
    </g>

    <g transform="translate(600, 190)">
      <circle cx="0" cy="0" r="68" fill="url(#nn-hid)" stroke="#FFE4E6" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#FFE4E6" opacity="0.85"/>
      <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>
    </g>

    <g transform="translate(600, 380)">
      <circle cx="0" cy="0" r="68" fill="url(#nn-hid)" stroke="#FFE4E6" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#FFE4E6" opacity="0.85"/>
      <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>
    </g>

    <g transform="translate(600, 570)">
      <circle cx="0" cy="0" r="68" fill="url(#nn-hid)" stroke="#FFE4E6" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#FFE4E6" opacity="0.85"/>
      <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>
    </g>

    <g transform="translate(970, 270)">
      <circle cx="0" cy="0" r="68" fill="url(#nn-out)" stroke="#F3E8FF" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#F3E8FF" opacity="0.85"/>
      <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>
    </g>

    <g transform="translate(970, 490)">
      <circle cx="0" cy="0" r="68" fill="url(#nn-out)" stroke="#F3E8FF" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#F3E8FF" opacity="0.85"/>
      <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
