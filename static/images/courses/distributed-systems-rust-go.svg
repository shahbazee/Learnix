  <path d="M 280 220 L 360 180 M 440 180 L 520 220" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="400" y="185" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#22d3ee">RAFT</text>
  <text x="250" y="225" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd">NODE A</text>
  <text x="550" y="225" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd">NODE B</text>
  <text x="400" y="350" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff">DISTRIBUTED SYSTEMS IN RUST &amp; GO</text>
