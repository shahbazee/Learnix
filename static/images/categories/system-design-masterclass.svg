<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="sd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0D1326"/>
      <stop offset="100%" stop-color="#1A153B"/>
    </linearGradient>

    <linearGradient id="sd-comp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="sd-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="sd-srv1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="sd-srv2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="sd-db-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <linearGradient id="sd-db-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <filter id="sd-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="sd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#sd-bg)"/>

  <circle cx="250" cy="370" r="160" fill="#0284C7" opacity="0.15" filter="url(#sd-glow)"/>
  <circle cx="610" cy="370" r="180" fill="#7C3AED" opacity="0.15" filter="url(#sd-glow)"/>
  <circle cx="970" cy="370" r="160" fill="#0D9488" opacity="0.15" filter="url(#sd-glow)"/>

  <g filter="url(#sd-shadow)">
    <path d="M 370 370 L 490 250" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
    <path d="M 370 370 L 490 490" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
    <path d="M 730 250 L 850 370" stroke="#A855F7" stroke-width="10" stroke-linecap="round"/>
    <path d="M 730 490 L 850 370" stroke="#F43F5E" stroke-width="10" stroke-linecap="round"/>

    <g transform="translate(130, 240)">
      <rect width="240" height="175" rx="20" fill="url(#sd-comp)" stroke="#E0F2FE" stroke-width="4"/>
      <rect x="18" y="18" width="204" height="139" rx="12" fill="url(#sd-screen)"/>
      <rect x="36" y="36" width="60" height="14" rx="7" fill="#38BDF8"/>
      <rect x="36" y="62" width="130" height="10" rx="5" fill="#94A3B8" opacity="0.7"/>
      <rect x="36" y="82" width="90" height="10" rx="5" fill="#94A3B8" opacity="0.7"/>
      <path d="M 120 175 L 120 235" stroke="#38BDF8" stroke-width="18" stroke-linecap="round"/>
      <path d="M 70 235 L 170 235" stroke="#38BDF8" stroke-width="18" stroke-linecap="round"/>
    </g>

    <g transform="translate(490, 180)">
      <rect width="240" height="140" rx="18" fill="url(#sd-srv1)" stroke="#F3E8FF" stroke-width="4"/>
      <rect x="22" y="30" width="120" height="20" rx="6" fill="#EDE9FE"/>
      <rect x="22" y="66" width="120" height="20" rx="6" fill="#C4B5FD"/>
      <circle cx="195" cy="40" r="10" fill="#34D399"/>
      <circle cx="195" cy="76" r="10" fill="#38BDF8"/>
      <line x1="22" y1="104" x2="218" y2="104" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(490, 420)">
      <rect width="240" height="140" rx="18" fill="url(#sd-srv2)" stroke="#FFE4E6" stroke-width="4"/>
      <rect x="22" y="30" width="120" height="20" rx="6" fill="#FFE4E6"/>
      <rect x="22" y="66" width="120" height="20" rx="6" fill="#FECDD3"/>
      <circle cx="195" cy="40" r="10" fill="#34D399"/>
      <circle cx="195" cy="76" r="10" fill="#FDE047"/>
      <line x1="22" y1="104" x2="218" y2="104" stroke="#BE123C" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(850, 200)">
      <path d="M 0 50 V 290 C 0 340 220 340 220 290 V 50 Z" fill="url(#sd-db-body)" stroke="#CCFBF1" stroke-width="4"/>
      <path d="M 0 130 C 0 175 220 175 220 130" fill="none" stroke="#042F2E" stroke-width="8"/>
      <path d="M 0 130 C 0 175 220 175 220 130" fill="none" stroke="#5EEAD4" stroke-width="4"/>
      <path d="M 0 210 C 0 255 220 255 220 210" fill="none" stroke="#042F2E" stroke-width="8"/>
      <path d="M 0 210 C 0 255 220 255 220 210" fill="none" stroke="#5EEAD4" stroke-width="4"/>
      <ellipse cx="110" cy="50" rx="110" ry="45" fill="url(#sd-db-top)" stroke="#CCFBF1" stroke-width="4"/>
    </g>
  </g>
</svg>
