<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="vdb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#081626"/>
      <stop offset="100%" stop-color="#0B2636"/>
    </linearGradient>

    <linearGradient id="vdb-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="vdb-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <linearGradient id="vdb-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="vdb-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="vdb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#vdb-bg)"/>

  <circle cx="420" cy="380" r="220" fill="#0284C7" opacity="0.15" filter="url(#vdb-glow)"/>
  <circle cx="820" cy="380" r="180" fill="#EC4899" opacity="0.15" filter="url(#vdb-glow)"/>

  <g filter="url(#vdb-shadow)">
    <g transform="translate(160, 180)">
      <path d="M 0 50 V 380 C 0 445 440 445 440 380 V 50 Z" fill="url(#vdb-body)" stroke="#E0F2FE" stroke-width="5"/>
      <path d="M 0 160 C 0 220 440 220 440 160" fill="none" stroke="#042F2E" stroke-width="10"/>
      <path d="M 0 160 C 0 220 440 220 440 160" fill="none" stroke="#67E8F9" stroke-width="5"/>
      <path d="M 0 270 C 0 330 440 330 440 270" fill="none" stroke="#042F2E" stroke-width="10"/>
      <path d="M 0 270 C 0 330 440 330 440 270" fill="none" stroke="#67E8F9" stroke-width="5"/>
      <ellipse cx="220" cy="50" rx="220" ry="50" fill="url(#vdb-top)" stroke="#E0F2FE" stroke-width="5"/>
    </g>

    <circle cx="680" cy="220" r="22" fill="#F43F5E" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="730" cy="290" r="18" fill="#FBBF24" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="650" cy="350" r="20" fill="#34D399" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="690" cy="430" r="24" fill="#A855F7" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="640" cy="500" r="18" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>

    <g transform="translate(720, 230)">
      <circle cx="110" cy="110" r="110" fill="url(#vdb-glass)"/>
      <circle cx="110" cy="110" r="110" fill="none" stroke="#38BDF8" stroke-width="16"/>
      <circle cx="110" cy="110" r="102" fill="none" stroke="#E0F2FE" stroke-width="4"/>

      <line x1="188" y1="188" x2="310" y2="310" stroke="#0284C7" stroke-width="36" stroke-linecap="round"/>
      <line x1="188" y1="188" x2="310" y2="310" stroke="#38BDF8" stroke-width="18" stroke-linecap="round"/>

      <circle cx="70" cy="80" r="20" fill="#F43F5E" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="140" cy="95" r="22" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="105" cy="150" r="24" fill="#A855F7" stroke="#FFFFFF" stroke-width="4"/>

      <line x1="70" y1="80" x2="140" y2="95" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 4" opacity="0.8"/>
      <line x1="140" y1="95" x2="105" y2="150" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 4" opacity="0.8"/>
      <line x1="105" y1="150" x2="70" y2="80" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 4" opacity="0.8"/>
    </g>
  </g>
</svg>
