<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" class="w-full h-full">
  <defs>
    <!-- Liquid Gradient for Upper Prism (Knowledge Cap) -->
    <linearGradient id="learnixGradientTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Liquid Gradient for Lower Continuous Learning Ribbon -->
    <linearGradient id="learnixGradientBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Core Focal Spark Gradient -->
    <linearGradient id="learnixCoreSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Subtle specular filter -->
    <filter id="learnixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="24" cy="24" r="18" fill="url(#learnixGradientTop)" opacity="0.12" filter="blur(6px)"/>

  <!-- Upper Knowledge Prism (Geometric Academy Cap / Dynamic Diamond) -->
  <path d="M 24 5 
           L 41 15.5 
           L 24 26 
           L 7 15.5 
           Z" 
        fill="url(#learnixGradientTop)" 
        filter="url(#learnixGlow)"/>

  <!-- Specular Light Reflection on Top Edge -->
  <path d="M 24 5.5 
           L 40 15.5 
           L 24 25" 
        stroke="rgba(255, 255, 255, 0.45)" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- Lower Nested Orbital Ribbon (Continuous Mastery & Growth) -->
  <path d="M 11 20 
           L 24 28 
           L 37 20 
           L 39 23.5 
           L 24 33 
           L 9 23.5 
           Z" 
        fill="url(#learnixGradientBottom)"/>

  <!-- Tertiary Dynamic Foundation Ribbon -->
  <path d="M 14.5 27 
           L 24 33 
           L 33.5 27 
           L 35 30 
           L 24 37 
           L 13 30 
           Z" 
        fill="url(#learnixGradientBottom)" 
        opacity="0.75"/>

  <!-- Central Intelligence Nexus Spark -->
  <circle cx="24" cy="15.5" r="2.5" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="24" cy="15.5" r="4.5" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" fill="none"/>
</svg>
